<!doctype html>
<!-- cSpell:locale en,es -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Exoplanet Transit Simulator</title>
<style>
  :root{
    --bg:#0f172a;
    --panel:#1e293b;
    --panel-header:#0f172a;
    --accent:#3b82f6;
    --accent-hover:#2563eb;
    --accent2:#f59e0b;
    --ok:#10b981;
    --text:#f8fafc;
    --muted:#94a3b8;
    --border:#334155;
    --border-light:#475569;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--text); background:var(--bg);
    min-height:100vh;
  }
  header{
    padding:12px 20px; position:sticky; top:0; z-index:100;
    background:var(--panel); border-bottom:1px solid var(--border);
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;
  }
  header h1{margin:0; font-weight:600; font-size:1.1rem; letter-spacing:.2px; color:var(--text)}
  .badge-tag{
    font-size:0.75rem; background:transparent; color:var(--muted); border:1px solid var(--border);
    padding:3px 10px; border-radius:6px; font-weight:500;
  }
  .wrap{
    max-width:1350px; margin:0 auto; padding:16px; display:flex; flex-direction:column; gap:16px;
  }
  .card{
    background:var(--panel); border:1px solid var(--border); border-radius:8px;
    overflow:hidden;
  }
  .card-header{
    padding:10px 14px; background:var(--panel-header); border-bottom:1px solid var(--border);
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;
    font-size:0.88rem; font-weight:600; color:var(--text);
  }
  
  /* Top controls */
  .controls-card{padding:14px}
  .controls-grid{
    display:grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap:14px;
  }
  .control-group{
    background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:12px;
    display:flex; flex-direction:column; gap:8px;
  }
  .control-group-title{
    font-size:0.78rem; text-transform:uppercase; letter-spacing:0.5px; color:var(--accent); font-weight:600;
    margin-bottom:2px; display:flex; align-items:center; justify-content:space-between;
  }
  .control{display:flex; flex-direction:column; gap:3px}
  .control label{
    display:flex; justify-content:space-between; font-size:0.84rem; color:var(--muted); font-weight:500;
  }
  .control output{
    font-variant-numeric: tabular-nums; color:var(--accent2); font-weight:600; min-width:5ch; text-align:right;
  }
  input[type="range"]{
    width:100%; -webkit-appearance:none; height:4px; border-radius:2px; background:var(--border); outline:none;
    margin:5px 0; cursor:pointer;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none; width:14px; height:14px; border-radius:50%;
    background:var(--accent); border:2px solid var(--bg);
    transition:background-color .15s ease;
  }
  input[type="range"]::-webkit-slider-thumb:hover{
    background:var(--accent-hover);
  }
  
  .actions-row{
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-top:10px;
    padding-top:10px; border-top:1px solid var(--border);
  }
  .hstack{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
  .hint{font-size:0.82rem; color:var(--muted)}
  .badgenote{
    display:inline-block; padding:2px 8px; border-radius:4px; background:var(--bg); border:1px solid var(--border); color:var(--muted); font-size:0.78rem;
  }
  button.secondary{
    background:var(--panel-header); color:var(--text); border:1px solid var(--border);
    border-radius:6px; padding:6px 12px; font-size:0.82rem; font-weight:500; cursor:pointer;
    transition:all .15s ease;
  }
  button.secondary:hover{background:var(--border); border-color:var(--border-light);}

  /* Visuals grid */
  .visuals-grid{
    display:grid; grid-template-columns: 1.1fr 0.9fr; gap:16px;
  }
  @media (max-width: 980px){
    .visuals-grid{grid-template-columns: 1fr}
  }

  .canvasWrap{
    position:relative; width:100%; background:var(--bg); border-radius:0 0 8px 8px; overflow:hidden;
  }
  .plotWrap{aspect-ratio: 16/10; min-height:340px;}
  .starWrap{aspect-ratio: 16/10; min-height:260px;}
  .orbit3DWrap{aspect-ratio: 16/10; min-height:280px; cursor:grab;}
  .orbit3DWrap:active{cursor:grabbing;}
  canvas{display:block; width:100%; height:100%}

  .tab-buttons{display:flex; gap:2px; background:var(--bg); padding:2px; border-radius:6px; border:1px solid var(--border);}
  .tab-btn{
    background:transparent; border:none; color:var(--muted); font-size:0.78rem; font-weight:500;
    padding:4px 10px; border-radius:4px; cursor:pointer; transition:all 0.15s ease;
  }
  .tab-btn.active{background:var(--accent); color:#ffffff;}

  .overlay-hint{
    position:absolute; bottom:8px; right:10px; background:var(--panel-header); border:1px solid var(--border);
    padding:3px 8px; border-radius:4px; font-size:0.75rem; color:var(--muted); pointer-events:none;
  }
</style>
</head>
<body>
<header>
  <h1>Exoplanet Transit Simulator</h1>
  <span class="badge-tag">Physical Model &amp; 3D Keplerian Geometry</span>
</header>

<div class="wrap">
  <!-- Top controls section -->
  <section class="card controls-card" aria-label="Controls">
    <div class="controls-grid">
      
      <!-- Group 1: Star & Planet -->
      <div class="control-group">
        <div class="control-group-title">
          <span>Star &amp; Planet</span>
        </div>
        <div class="control">
          <label><span>Planet radius Rₚ (R<sub>⊕</sub>)</span> <output id="out-rplanet">11.00</output></label>
          <input id="rPlanet" type="range" min="0.50" max="25.0" step="0.1" value="11.0" />
        </div>
        <div class="control">
          <label><span>Stellar radius R<sub>★</sub> (R<sub>☉</sub>)</span> <output id="out-rstar">1.00</output></label>
          <input id="rStar" type="range" min="0.10" max="5.0" step="0.05" value="1.00" />
        </div>
        <div class="control">
          <label><span>Limb darkening u₁</span> <output id="out-u1">0.30</output></label>
          <input id="u1" type="range" min="0.00" max="1.00" step="0.01" value="0.30" />
        </div>
        <div class="control">
          <label><span>Limb darkening u₂</span> <output id="out-u2">0.20</output></label>
          <input id="u2" type="range" min="0.00" max="1.00" step="0.01" value="0.20" />
        </div>
      </div>

      <!-- Group 2: Keplerian Orbit -->
      <div class="control-group">
        <div class="control-group-title">
          <span>Keplerian Orbit</span>
          <span style="font-size:0.75rem; color:var(--muted); font-weight:normal;">Kepler's 3rd Law</span>
        </div>
        <div class="control">
          <label><span>Semi-major axis a (R<sub>★</sub>)</span> <output id="out-aRs">10.0</output></label>
          <input id="aRs" type="range" min="2.0" max="50.0" step="0.5" value="10.0" />
        </div>
        <div class="control">
          <label><span>Orbital period P (days)</span> <output id="out-period">3.65</output></label>
          <input id="period" type="range" min="0.5" max="100.0" step="0.1" value="3.65" />
        </div>
        <div class="control">
          <label><span>Eccentricity e</span> <output id="out-ecc">0.00</output></label>
          <input id="ecc" type="range" min="0.00" max="0.85" step="0.01" value="0.00" />
        </div>
        <div class="control">
          <label><span>Arg. of periastron ω (°)</span> <output id="out-omega">90</output></label>
          <input id="omega" type="range" min="0" max="360" step="1" value="90" />
        </div>
      </div>

      <!-- Group 3: Orientation & Time -->
      <div class="control-group">
        <div class="control-group-title">
          <span>Geometry &amp; Time</span>
        </div>
        <div class="control">
          <label><span>Inclination i (°)</span> <output id="out-inc">89.0</output></label>
          <input id="inc" type="range" min="70.0" max="90.0" step="0.1" value="89.0" />
        </div>
        <div class="control">
          <label><span>Time phase t</span> <output id="out-time">0.000</output></label>
          <input id="timeCursor" type="range" min="0" max="1" step="0.001" value="0.5" />
        </div>
        <div style="margin-top:auto; padding-top:4px;">
          <button class="secondary" id="reset" style="width:100%;">Reset Parameters</button>
        </div>
      </div>

    </div>

    <div class="actions-row">
      <div class="hint" id="impactInfo">b = … | Rp/R★ = …</div>
      <div><span id="note" class="badgenote" role="status" aria-live="polite"></span></div>
    </div>
  </section>

  <!-- Bottom visuals grid: Left (Light curve) and Right (Stellar Disk / 3D Orbit) -->
  <div class="visuals-grid">
    
    <!-- Left Column: Light Curve -->
    <section class="card" aria-label="Light Curve">
      <div class="card-header">
        <span>Transit Light Curve (Normalized Flux)</span>
        <span class="hint" id="depthInfo">Depth: -- ppm</span>
      </div>
      <div class="canvasWrap plotWrap">
        <canvas id="plot"></canvas>
      </div>
    </section>

    <!-- Right Column: Stellar Disk (2D) and Orbit (3D) -->
    <section class="card" aria-label="Spatial Visualizations">
      <div class="card-header">
        <span id="rightPanelTitle">Stellar Disk &amp; 2D Transit</span>
        <div class="tab-buttons">
          <button class="tab-btn active" id="tabStar">Stellar Disk</button>
          <button class="tab-btn" id="tabOrbit">3D Orbit</button>
          <button class="tab-btn" id="tabBoth">Both</button>
        </div>
      </div>
      
      <div id="starContainer" class="canvasWrap starWrap">
        <canvas id="starView"></canvas>
      </div>
      
      <div id="orbitContainer" class="canvasWrap orbit3DWrap" style="display:none; border-top:1px solid var(--border)">
        <canvas id="orbit3D"></canvas>
        <div class="overlay-hint">Drag to rotate 3D view ↺</div>
      </div>
    </section>

  </div>
</div>

<script>
(function(){
  // DOM Elements
  const els = {
    rPlanet: document.getElementById('rPlanet'),
    rStar: document.getElementById('rStar'),
    u1: document.getElementById('u1'),
    u2: document.getElementById('u2'),
    aRs: document.getElementById('aRs'),
    period: document.getElementById('period'),
    ecc: document.getElementById('ecc'),
    omega: document.getElementById('omega'),
    inc: document.getElementById('inc'),
    timeCursor: document.getElementById('timeCursor'),

    outRPlanet: document.getElementById('out-rplanet'),
    outRStar: document.getElementById('out-rstar'),
    outU1: document.getElementById('out-u1'),
    outU2: document.getElementById('out-u2'),
    outARs: document.getElementById('out-aRs'),
    outPeriod: document.getElementById('out-period'),
    outEcc: document.getElementById('out-ecc'),
    outOmega: document.getElementById('out-omega'),
    outInc: document.getElementById('out-inc'),
    outTime: document.getElementById('out-time'),

    note: document.getElementById('note'),
    impactInfo: document.getElementById('impactInfo'),
    depthInfo: document.getElementById('depthInfo'),
    reset: document.getElementById('reset'),

    plot: document.getElementById('plot'),
    star: document.getElementById('starView'),
    orbit3D: document.getElementById('orbit3D'),

    starContainer: document.getElementById('starContainer'),
    orbitContainer: document.getElementById('orbitContainer'),
    rightPanelTitle: document.getElementById('rightPanelTitle'),

    tabStar: document.getElementById('tabStar'),
    tabOrbit: document.getElementById('tabOrbit'),
    tabBoth: document.getElementById('tabBoth'),
  };

  const NPTS = 251;
  const RADIAL_BINS = 1500;
  const EARTH_TO_SOLAR = 0.0091577; // Earth radius in solar radii
  const AU_TO_SOLAR = 215.032;      // 1 AU in solar radii

  const ringRmid = new Float32Array(RADIAL_BINS);
  const ringArea = new Float32Array(RADIAL_BINS);
  const intensityProfile = new Float32Array(RADIAL_BINS);
  let sumIdisk = 1;

  function initGrid(){
    const dr = 1 / RADIAL_BINS;
    for (let i=0; i<RADIAL_BINS; i++){
      const rInner = i * dr;
      const rOuter = (i + 1) * dr;
      ringRmid[i] = (rInner + rOuter) * 0.5;
      ringArea[i] = Math.PI * (rOuter*rOuter - rInner*rInner);
      intensityProfile[i] = 0;
    }
  }

  // ------- Realistic Stellar Colors by Spectral Type / T_eff -------
  const STELLAR_COLOR_STOPS = [
    { r: 0.10, rgb: [255, 110, 50] },  // Cool M-dwarf (red-orange)
    { r: 0.40, rgb: [255, 140, 70] },  // Mid M-dwarf
    { r: 0.70, rgb: [255, 178, 100] }, // K-dwarf (orange)
    { r: 1.00, rgb: [255, 215, 130] }, // G-dwarf (Sun: warm golden yellow-orange)
    { r: 1.40, rgb: [255, 242, 210] }, // F-dwarf (pale yellow-white)
    { r: 2.00, rgb: [250, 250, 255] }, // A-star / Subgiant (soft white)
    { r: 5.00, rgb: [242, 247, 255] }, // A-type Giant (bright crisp white)
  ];

  function getStellarRGB(rStar){
    const r = Math.min(5.0, Math.max(0.1, rStar));
    if (r <= STELLAR_COLOR_STOPS[0].r) return STELLAR_COLOR_STOPS[0].rgb.slice();
    if (r >= STELLAR_COLOR_STOPS[STELLAR_COLOR_STOPS.length-1].r){
      return STELLAR_COLOR_STOPS[STELLAR_COLOR_STOPS.length-1].rgb.slice();
    }
    for (let i=0; i<STELLAR_COLOR_STOPS.length-1; i++){
      const s1 = STELLAR_COLOR_STOPS[i];
      const s2 = STELLAR_COLOR_STOPS[i+1];
      if (r >= s1.r && r <= s2.r){
        const frac = (r - s1.r)/(s2.r - s1.r);
        return [
          Math.round(s1.rgb[0] + (s2.rgb[0] - s1.rgb[0]) * frac),
          Math.round(s1.rgb[1] + (s2.rgb[1] - s1.rgb[1]) * frac),
          Math.round(s1.rgb[2] + (s2.rgb[2] - s1.rgb[2]) * frac),
        ];
      }
    }
    return [255, 215, 130];
  }

  // ------- Kepler's Third Law coupling P (days) <-> a/R★ -------
  function periodFromARs(aRs, rStar){
    const aAU = (aRs * rStar) / AU_TO_SOLAR;
    const mStar = Math.pow(rStar, 0.8);
    const pYears = Math.sqrt(Math.max(1e-6, Math.pow(aAU, 3) / Math.max(0.1, mStar)));
    return Math.max(0.1, pYears * 365.25);
  }

  function aRsFromPeriod(periodDays, rStar){
    const pYears = periodDays / 365.25;
    const mStar = Math.pow(rStar, 0.8);
    const aAU = Math.pow(pYears * pYears * mStar, 1/3);
    const aRs = (aAU * AU_TO_SOLAR) / rStar;
    return Math.min(50.0, Math.max(2.0, aRs));
  }

  // ------- Limb Darkening -------
  function updateIntensity(u1, u2){
    let sumI = 0;
    for (let i=0; i<RADIAL_BINS; i++){
      const r = ringRmid[i];
      const muVal = Math.sqrt(Math.max(0, 1 - r*r));
      const oneMinus = 1 - muVal;
      const Ii = Math.max(0, 1 - u1*oneMinus - u2*oneMinus*oneMinus);
      intensityProfile[i] = Ii;
      sumI += Ii * ringArea[i];
    }
    sumIdisk = sumI;
  }

  function occultedArcFraction(r, d, k){
    const EPS = 1e-7;
    if (r <= EPS) return d <= k ? 1 : 0;
    if (d >= r + k - EPS) return 0;
    if (d + k <= r + EPS) return 0;
    if (k >= d + r - EPS) return 1;
    if (d <= Math.abs(r - k) + EPS) return (k > r) ? 1 : 0;
    const cosTheta = (r*r + d*d - k*k) / (2 * r * d);
    return Math.acos(Math.min(1, Math.max(-1, cosTheta))) / Math.PI;
  }

  function computeOccultedIntensity(d, k){
    let occ = 0;
    for (let i=0; i<RADIAL_BINS; i++){
      const frac = occultedArcFraction(ringRmid[i], d, k);
      if (frac > 0) occ += intensityProfile[i] * ringArea[i] * frac;
    }
    return occ;
  }

  // ------- Kepler Equation & 3D Positions -------
  function solveKepler(M, e){
    let E = M;
    for (let iter=0; iter<10; iter++){
      const fE = E - e * Math.sin(E) - M;
      const fE_prime = 1 - e * Math.cos(E);
      const delta = fE / fE_prime;
      E -= delta;
      if (Math.abs(delta) < 1e-8) break;
    }
    return E;
  }

  function getPositionAtPhase(phase, aRs, e, omegaDeg, incDeg){
    const omega = omegaDeg * Math.PI / 180;
    const inc = incDeg * Math.PI / 180;

    const fMid = Math.PI/2 - omega;
    const tanEMid = Math.tan(fMid / 2) * Math.sqrt((1 - e) / (1 + e));
    const EMid = 2 * Math.atan(tanEMid);
    const MMid = EMid - e * Math.sin(EMid);

    const M = MMid + 2 * Math.PI * phase;
    const E = solveKepler(M, e);
    const f = 2 * Math.atan2(Math.sqrt(1 + e) * Math.sin(E/2), Math.sqrt(1 - e) * Math.cos(E/2));

    const r = (aRs * (1 - e*e)) / (1 + e * Math.cos(f));
    const th = f + omega;

    const xSky = r * Math.cos(th);
    const ySky = r * Math.sin(th) * Math.cos(inc);
    const zSky = r * Math.sin(th) * Math.sin(inc);

    return { xSky, ySky, zSky, r, f };
  }

  // ------- Full Light Curve Compute -------
  function computeLightCurve(rPlanetEarth, u1, u2, rStar, aRs, incDeg, e, omegaDeg){
    updateIntensity(u1, u2);
    const safeStar = Math.max(rStar, 0.05);
    const safePlanet = Math.max(rPlanetEarth, 0);
    const k = (safePlanet * EARTH_TO_SOLAR) / safeStar;

    const inc = incDeg * Math.PI / 180;
    const omega = omegaDeg * Math.PI / 180;
    const rTransit = (aRs * (1 - e*e)) / (1 + e * Math.sin(omega));
    const b = rTransit * Math.cos(inc);

    const statusMsgs = [];
    if (k <= 0) statusMsgs.push("Zero planet radius");
    if (b >= 1 + k) statusMsgs.push("No transit (b > 1 + k)");
    else if (b > 1 - k && b < 1 + k) statusMsgs.push("Grazing transit");

    els.note.textContent = statusMsgs.join(" · ");
    els.impactInfo.textContent = `b = ${b.toFixed(3)} | Rp/R★ = ${k.toFixed(4)} | Rp=${safePlanet.toFixed(1)}R⊕ | R★=${safeStar.toFixed(2)}R☉`;

    const phaseSpan = 0.15;
    const times = new Float32Array(NPTS);
    const flux = new Float32Array(NPTS);

    const norm = sumIdisk > 0 ? sumIdisk : 1;
    let minFlux = 1.0;

    for (let n=0; n<NPTS; n++){
      const phase = -phaseSpan + (n / (NPTS - 1)) * (2 * phaseSpan);
      times[n] = phase;

      const pos = getPositionAtPhase(phase, aRs, e, omegaDeg, incDeg);

      if (pos.zSky <= 0 || k <= 0){
        flux[n] = 1.0; continue;
      }

      const d = Math.sqrt(pos.xSky*pos.xSky + pos.ySky*pos.ySky);
      if (d >= 1 + k){
        flux[n] = 1.0; continue;
      }

      const occ = computeOccultedIntensity(d, k);
      const F = 1.0 - (occ / norm);
      flux[n] = F;
      if (F < minFlux) minFlux = F;
    }

    const depthPpm = Math.max(0, Math.round((1.0 - minFlux) * 1e6));
    els.depthInfo.textContent = `Depth: ${(depthPpm / 10000).toFixed(3)}% (${depthPpm.toLocaleString()} ppm)`;

    return {
      times, flux, k, b, aRs, safeStar, safePlanet, phaseSpan, minFlux
    };
  }

  // ------- CANVAS RENDERING -------
  function setupCanvas(c){
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    const rect = c.parentElement.getBoundingClientRect();
    const w = Math.floor(rect.width);
    const h = Math.floor(rect.height);
    if (c.width !== w * dpr || c.height !== h * dpr){
      c.width = w * dpr;
      c.height = h * dpr;
    }
    const ctx = c.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { ctx, w, h };
  }

  // 1. Light Curve
  function drawCurve(c, res, timeAlpha){
    const { ctx, w, h } = setupCanvas(c);
    if (!res || !w || !h) return;

    const padL=55, padR=20, padT=20, padB=38;
    const innerW = w - padL - padR;
    const innerH = h - padT - padB;

    ctx.clearRect(0,0,w,h);
    ctx.fillStyle = "#0f172a"; ctx.fillRect(0,0,w,h);

    ctx.strokeStyle = "#1e293b"; ctx.lineWidth = 1;
    for (let gx=padL; gx<=w-padR; gx+=innerW/6){
      ctx.beginPath(); ctx.moveTo(gx, padT); ctx.lineTo(gx, h-padB); ctx.stroke();
    }
    for (let gy=padT; gy<=h-padB; gy+=innerH/5){
      ctx.beginPath(); ctx.moveTo(padL, gy); ctx.lineTo(w-padR, gy); ctx.stroke();
    }

    ctx.strokeStyle = "#334155"; ctx.strokeRect(padL, padT, innerW, innerH);

    const times = res.times;
    const flux = res.flux;
    const xmin = times[0], xmax = times[times.length-1];
    const xRange = xmax - xmin;

    let minF = res.minFlux;
    const yPad = Math.max(0.0005, (1.0 - minF) * 0.15);
    const ymin = Math.min(minF - yPad, 0.995);
    const ymax = 1.002;
    const yRange = ymax - ymin;

    ctx.fillStyle = "#94a3b8"; ctx.font = "11px system-ui, sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "top";
    for (let i=0; i<=6; i++){
      const val = xmin + (i/6)*xRange;
      const x = padL + (i/6)*innerW;
      ctx.fillText(val.toFixed(3), x, h - padB + 6);
    }
    ctx.textAlign = "right"; ctx.textBaseline = "middle";
    for (let i=0; i<=5; i++){
      const val = ymin + (i/5)*yRange;
      const y = padT + (1 - i/5)*innerH;
      ctx.fillText(val.toFixed(4), padL - 6, y);
    }

    ctx.fillStyle = "#f8fafc"; ctx.textAlign = "center"; ctx.textBaseline = "bottom";
    ctx.fillText("Orbital Phase (t)", padL + innerW/2, h - 4);
    ctx.save(); ctx.translate(14, padT + innerH/2); ctx.rotate(-Math.PI/2);
    ctx.fillText("Normalized Flux", 0, 0); ctx.restore();

    ctx.strokeStyle = "#3b82f6"; ctx.lineWidth = 2.0; ctx.beginPath();
    for (let i=0; i<times.length; i++){
      const x = padL + ((times[i] - xmin)/xRange) * innerW;
      const y = padT + (1 - (flux[i] - ymin)/yRange) * innerH;
      if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.stroke();

    const currentPhase = -res.phaseSpan + timeAlpha * (2 * res.phaseSpan);
    const pos = getPositionAtPhase(currentPhase, res.aRs, state.ecc, state.omega, state.inc);
    const currentFlux = (pos.zSky > 0 && Math.sqrt(pos.xSky*pos.xSky + pos.ySky*pos.ySky) < 1 + res.k)
      ? 1.0 - (computeOccultedIntensity(Math.sqrt(pos.xSky*pos.xSky + pos.ySky*pos.ySky), res.k) / sumIdisk)
      : 1.0;

    const cx = padL + ((currentPhase - xmin)/xRange) * innerW;
    const cy = padT + (1 - (currentFlux - ymin)/yRange) * innerH;

    ctx.strokeStyle = "#f59e0b"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(cx, padT); ctx.lineTo(cx, h - padB); ctx.stroke();
    ctx.fillStyle = "#f59e0b"; ctx.beginPath(); ctx.arc(cx, cy, 4, 0, 2*Math.PI); ctx.fill();
  }

  // 2. Stellar Disk 2D
  function drawStarView(c, res, timeAlpha, u1, u2){
    const { ctx, w, h } = setupCanvas(c);
    if (!res || !w || !h) return;

    ctx.clearRect(0,0,w,h);
    ctx.fillStyle = "#0f172a"; ctx.fillRect(0,0,w,h);

    const cx = w/2, cy = h/2;
    const R = Math.min(w,h) * 0.38;

    const currentPhase = -res.phaseSpan + timeAlpha * (2 * res.phaseSpan);
    const pos = getPositionAtPhase(currentPhase, res.aRs, state.ecc, state.omega, state.inc);
    const px = cx + pos.xSky * R;
    const py = cy + pos.ySky * R;
    const k = res.k;

    const rgb = getStellarRGB(res.safeStar);

    const glow = ctx.createRadialGradient(cx, cy, R*0.85, cx, cy, R*1.25);
    glow.addColorStop(0, `rgba(${rgb[0]},${rgb[1]},${rgb[2]},0.25)`);
    glow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(cx,cy,R*1.25,0,2*Math.PI); ctx.fill();

    const pixelW = Math.floor(w * 0.7);
    const pixelH = Math.floor(h * 0.7);
    const offCanvas = document.createElement('canvas');
    offCanvas.width = pixelW; offCanvas.height = pixelH;
    const offCtx = offCanvas.getContext('2d');
    const imgData = offCtx.createImageData(pixelW, pixelH);
    const data = imgData.data;

    const scaleX = w / pixelW;
    const scaleY = h / pixelH;

    for (let j=0; j<pixelH; j++){
      const yCss = (j + 0.5) * scaleY;
      for (let i=0; i<pixelW; i++){
        const xCss = (i + 0.5) * scaleX;
        const dx = (xCss - cx)/R;
        const dy = (yCss - cy)/R;
        const r2 = dx*dx + dy*dy;
        const idx = (j*pixelW + i)*4;

        if (r2 > 1.0){
          data[idx+3] = 0; continue;
        }

        const mu = Math.sqrt(1 - r2);
        const oneMinus = 1 - mu;
        let Ipix = Math.max(0, 1 - u1*oneMinus - u2*oneMinus*oneMinus);

        if (pos.zSky > 0){
          const dxp = (xCss - px)/R;
          const dyp = (yCss - py)/R;
          if (dxp*dxp + dyp*dyp <= k*k) Ipix = 0;
        }

        if (Ipix <= 0){
          data[idx+0] = 15; data[idx+1] = 23; data[idx+2] = 42; data[idx+3] = 255;
        } else {
          const bright = 0.3 + 0.7 * Math.pow(Ipix, 0.9);
          data[idx+0] = Math.min(255, Math.round(rgb[0] * bright));
          data[idx+1] = Math.min(255, Math.round(rgb[1] * bright));
          data[idx+2] = Math.min(255, Math.round(rgb[2] * bright));
          data[idx+3] = 255;
        }
      }
    }
    offCtx.putImageData(imgData, 0, 0);
    ctx.drawImage(offCanvas, 0, 0, w, h);

    ctx.strokeStyle = `rgba(${rgb[0]},${rgb[1]},${rgb[2]},0.7)`; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(cx,cy,R,0,2*Math.PI); ctx.stroke();

    if (pos.zSky > 0){
      ctx.strokeStyle = "#cbd5e1"; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(px,py,Math.max(2, k*R),0,2*Math.PI); ctx.stroke();
    }
  }

  // 3. Interactive 3D Orbit
  let camRotX = -0.4, camRotY = 0.5;
  let isDragging = false, lastMouseX=0, lastMouseY=0;

  function bindOrbit3DControls(c){
    c.addEventListener('mousedown', (e)=>{
      isDragging = true; lastMouseX = e.clientX; lastMouseY = e.clientY;
    });
    window.addEventListener('mousemove', (e)=>{
      if (!isDragging) return;
      const dx = e.clientX - lastMouseX;
      const dy = e.clientY - lastMouseY;
      camRotY += dx * 0.008;
      camRotX += dy * 0.008;
      camRotX = Math.min(Math.PI/2 - 0.1, Math.max(-Math.PI/2 + 0.1, camRotX));
      lastMouseX = e.clientX; lastMouseY = e.clientY;
      requestRender();
    });
    window.addEventListener('mouseup', ()=> isDragging = false);

    c.addEventListener('touchstart', (e)=>{
      if (e.touches.length === 1){
        isDragging = true; lastMouseX = e.touches[0].clientX; lastMouseY = e.touches[0].clientY;
      }
    });
    window.addEventListener('touchmove', (e)=>{
      if (!isDragging || e.touches.length !== 1) return;
      const dx = e.touches[0].clientX - lastMouseX;
      const dy = e.touches[0].clientY - lastMouseY;
      camRotY += dx * 0.008;
      camRotX += dy * 0.008;
      lastMouseX = e.touches[0].clientX; lastMouseY = e.touches[0].clientY;
      requestRender();
    });
    window.addEventListener('touchend', ()=> isDragging = false);
  }

  function drawOrbit3D(c, res, timeAlpha){
    const { ctx, w, h } = setupCanvas(c);
    if (!res || !w || !h) return;

    ctx.clearRect(0,0,w,h);
    ctx.fillStyle = "#0f172a"; ctx.fillRect(0,0,w,h);

    const cx = w/2, cy = h/2;
    const scale = Math.min(w,h) * 0.35 / (res.aRs * 1.2);

    function project3D(X, Y, Z){
      const x1 = X * Math.cos(camRotY) + Z * Math.sin(camRotY);
      const z1 = -X * Math.sin(camRotY) + Z * Math.cos(camRotY);
      const y2 = Y * Math.cos(camRotX) - z1 * Math.sin(camRotX);
      const z2 = Y * Math.sin(camRotX) + z1 * Math.cos(camRotX);

      return {
        px: cx + x1 * scale,
        py: cy - y2 * scale,
        pz: z2
      };
    }

    // Sky Plane (Z = 0)
    ctx.strokeStyle = "#334155"; ctx.lineWidth = 1;
    const planeSize = res.aRs * 1.3;
    const p1 = project3D(-planeSize, -planeSize, 0);
    const p2 = project3D(planeSize, -planeSize, 0);
    const p3 = project3D(planeSize, planeSize, 0);
    const p4 = project3D(-planeSize, planeSize, 0);

    ctx.beginPath();
    ctx.moveTo(p1.px, p1.py); ctx.lineTo(p2.px, p2.py);
    ctx.lineTo(p3.px, p3.py); ctx.lineTo(p4.px, p4.py); ctx.closePath();
    ctx.fillStyle = "rgba(51, 65, 85, 0.15)"; ctx.fill(); ctx.stroke();

    ctx.fillStyle = "#94a3b8"; ctx.font = "10px system-ui, sans-serif";
    ctx.fillText("Sky Plane (Z=0)", p3.px + 4, p3.py);

    // Line of Sight
    const losStart = project3D(0,0,0);
    const losEnd = project3D(0, 0, res.aRs * 0.9);
    ctx.strokeStyle = "#f59e0b"; ctx.lineWidth = 1.6; ctx.setLineDash([4,3]);
    ctx.beginPath(); ctx.moveTo(losStart.px, losStart.py); ctx.lineTo(losEnd.px, losEnd.py); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = "#f59e0b"; ctx.fillText("Line of Sight (L.O.S.)", losEnd.px + 4, losEnd.py);

    // Central Star
    const starP = project3D(0,0,0);
    const rgb = getStellarRGB(res.safeStar);
    const rPixel = Math.max(5, scale * 1.0);
    const starGlow = ctx.createRadialGradient(starP.px, starP.py, 0, starP.px, starP.py, rPixel*1.8);
    starGlow.addColorStop(0, `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`);
    starGlow.addColorStop(0.6, `rgba(${rgb[0]},${rgb[1]},${rgb[2]},0.5)`);
    starGlow.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = starGlow; ctx.beginPath(); ctx.arc(starP.px, starP.py, rPixel*1.8, 0, 2*Math.PI); ctx.fill();

    // 3D Orbital Ellipse
    const orbitPts = [];
    const N_ORBIT = 180;
    for (let i=0; i<=N_ORBIT; i++){
      const ph = (i / N_ORBIT) - 0.5;
      const pos = getPositionAtPhase(ph, res.aRs, state.ecc, state.omega, state.inc);
      orbitPts.push({ ...pos, proj: project3D(pos.xSky, pos.ySky, pos.zSky) });
    }

    for (let i=0; i<orbitPts.length-1; i++){
      const pt1 = orbitPts[i];
      const pt2 = orbitPts[i+1];
      const isFront = (pt1.zSky + pt2.zSky) > 0;

      ctx.strokeStyle = isFront ? "#60a5fa" : "#475569";
      ctx.lineWidth = isFront ? 1.8 : 1.0;
      if (!isFront) ctx.setLineDash([3,3]); else ctx.setLineDash([]);

      ctx.beginPath(); ctx.moveTo(pt1.proj.px, pt1.proj.py); ctx.lineTo(pt2.proj.px, pt2.proj.py); ctx.stroke();
    }
    ctx.setLineDash([]);

    // 3D Planet
    const currentPhase = -res.phaseSpan + timeAlpha * (2 * res.phaseSpan);
    const planetPos = getPositionAtPhase(currentPhase, res.aRs, state.ecc, state.omega, state.inc);
    const planetP = project3D(planetPos.xSky, planetPos.ySky, planetPos.zSky);

    const planetRPixel = Math.max(3, res.k * scale * 1.0);
    ctx.fillStyle = "#cbd5e1"; ctx.beginPath(); ctx.arc(planetP.px, planetP.py, planetRPixel + 1, 0, 2*Math.PI); ctx.fill();
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1.0; ctx.stroke();
  }

  // ------- State & Sync -------
  const state = {
    rPlanet: parseFloat(els.rPlanet.value),
    rStar: parseFloat(els.rStar.value),
    u1: parseFloat(els.u1.value),
    u2: parseFloat(els.u2.value),
    aRs: parseFloat(els.aRs.value),
    period: parseFloat(els.period.value),
    ecc: parseFloat(els.ecc.value),
    omega: parseFloat(els.omega.value),
    inc: parseFloat(els.inc.value),
    timeAlpha: parseFloat(els.timeCursor.value),
  };

  let lastResult = null;
  let needsRecompute = true;

  function syncOutputs(){
    els.outRPlanet.textContent = state.rPlanet.toFixed(2);
    els.outRStar.textContent = state.rStar.toFixed(2);
    els.outU1.textContent = state.u1.toFixed(2);
    els.outU2.textContent = state.u2.toFixed(2);
    els.outARs.textContent = state.aRs.toFixed(1);
    els.outPeriod.textContent = state.period.toFixed(2);
    els.outEcc.textContent = state.ecc.toFixed(2);
    els.outOmega.textContent = Math.round(state.omega).toString();
    els.outInc.textContent = state.inc.toFixed(1);
    els.outTime.textContent = state.timeAlpha.toFixed(3);
  }

  let rafId = null;
  function requestRender(){
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(renderAll);
  }

  function renderAll(){
    if (needsRecompute || !lastResult){
      lastResult = computeLightCurve(
        state.rPlanet, state.u1, state.u2, state.rStar, state.aRs, state.inc, state.ecc, state.omega
      );
      needsRecompute = false;
    }
    syncOutputs();
    drawCurve(els.plot, lastResult, state.timeAlpha);
    drawStarView(els.star, lastResult, state.timeAlpha, state.u1, state.u2);
    drawOrbit3D(els.orbit3D, lastResult, state.timeAlpha);
  }

  // ------- Event Listeners -------
  function bindSlider(el, key, onChange){
    el.addEventListener('input', ()=>{
      const val = parseFloat(el.value);
      if (isFinite(val)){
        state[key] = val;
        if (onChange) onChange(val);
      }
      needsRecompute = true;
      requestRender();
    });
  }

  bindSlider(els.rPlanet, 'rPlanet');
  bindSlider(els.rStar, 'rStar', ()=>{
    state.period = periodFromARs(state.aRs, state.rStar);
    els.period.value = state.period.toString();
  });
  bindSlider(els.u1, 'u1');
  bindSlider(els.u2, 'u2');

  bindSlider(els.aRs, 'aRs', (newARs)=>{
    state.period = periodFromARs(newARs, state.rStar);
    els.period.value = state.period.toString();
  });

  bindSlider(els.period, 'period', (newP)=>{
    state.aRs = aRsFromPeriod(newP, state.rStar);
    els.aRs.value = state.aRs.toString();
  });

  bindSlider(els.ecc, 'ecc');
  bindSlider(els.omega, 'omega');
  bindSlider(els.inc, 'inc');

  els.timeCursor.addEventListener('input', ()=>{
    state.timeAlpha = parseFloat(els.timeCursor.value);
    requestRender();
  });

  els.reset.addEventListener('click', ()=>{
    els.rPlanet.value = "11.0"; state.rPlanet = 11.0;
    els.rStar.value = "1.00"; state.rStar = 1.00;
    els.u1.value = "0.30"; state.u1 = 0.30;
    els.u2.value = "0.20"; state.u2 = 0.20;
    els.aRs.value = "10.0"; state.aRs = 10.0;
    els.period.value = "3.65"; state.period = 3.65;
    els.ecc.value = "0.00"; state.ecc = 0.00;
    els.omega.value = "90"; state.omega = 90;
    els.inc.value = "89.0"; state.inc = 89.0;
    els.timeCursor.value = "0.5"; state.timeAlpha = 0.5;

    needsRecompute = true;
    requestRender();
  });

  // Tab controls
  function setTab(tabName){
    els.tabStar.classList.remove('active');
    els.tabOrbit.classList.remove('active');
    els.tabBoth.classList.remove('active');

    if (tabName === 'star'){
      els.tabStar.classList.add('active');
      els.starContainer.style.display = 'block';
      els.orbitContainer.style.display = 'none';
      els.rightPanelTitle.textContent = "Stellar Disk & 2D Transit";
    } else if (tabName === 'orbit'){
      els.tabOrbit.classList.add('active');
      els.starContainer.style.display = 'none';
      els.orbitContainer.style.display = 'block';
      els.rightPanelTitle.textContent = "3D Orbital Geometry";
    } else {
      els.tabBoth.classList.add('active');
      els.starContainer.style.display = 'block';
      els.orbitContainer.style.display = 'block';
      els.rightPanelTitle.textContent = "Stellar Disk (2D) & Orbit (3D)";
    }
    requestRender();
  }

  els.tabStar.addEventListener('click', ()=> setTab('star'));
  els.tabOrbit.addEventListener('click', ()=> setTab('orbit'));
  els.tabBoth.addEventListener('click', ()=> setTab('both'));

  bindOrbit3DControls(els.orbit3D);
  window.addEventListener('resize', ()=> requestRender(), {passive:true});

  // Init
  initGrid();
  requestRender();
})();
</script>
</body>
</html>

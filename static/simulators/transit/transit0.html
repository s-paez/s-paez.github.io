<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Exoplanet Transit Animation + Light Curve</title>
<style>
  :root{
    --bg:#0f1220;
    --panel:#161a2e;
    --text:#e8ecff;
    --muted:#a7b1d6;
    --accent:#7aa2ff;
    --accent2:#f9b857;
    --ok:#59f2a7;
    --border:#1f2546;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100%;
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,"Helvetica Neue",Arial,"Apple Color Emoji","Segoe UI Emoji";
    color:var(--text);
    background:linear-gradient(180deg,#0b0e1a 0%, #0f1220 60%, #0b0e1a 100%);
  }
  .wrap{
    max-width:1100px; margin:0 auto;
    padding:24px clamp(16px,4vw,32px);
    display:grid; gap:18px;
  }
  header{
    display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap;
    padding:0 clamp(4px,2vw,12px);
  }
  header h1{
    margin:0; font-weight:650;
    font-size:clamp(20px,3.4vw,30px);
    letter-spacing:.2px;
  }
  header .meta{
    color:var(--muted); font-size:.9rem; display:flex; gap:14px; flex-wrap:wrap;
  }
  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:18px;
    padding:clamp(14px,3vw,22px);
    box-shadow:0 12px 32px rgba(0,0,0,.28);
  }
  .canvas-box{ position:relative; }
  canvas{
    display:block; width:100%;
    height:min(60vh,520px);
    border-radius:14px;
    background:#0c1024;
    border:1px solid var(--border);
  }
  #curve{ height:min(40vh,340px); }
  .row{ display:grid; gap:16px; }
  .legend{
    position:absolute; right:16px; top:16px;
    display:flex; gap:12px; align-items:center; flex-wrap:wrap;
    padding:8px 12px; border-radius:12px;
    font-size:.85rem; color:var(--muted);
    background:rgba(18,22,44,.7);
    border:1px solid rgba(42,48,83,.8);
    backdrop-filter:blur(6px);
  }
  .dot{ width:12px; height:12px; border-radius:50%; display:inline-block; }
  .k1{ background:var(--accent); }
  .k2{ background:var(--accent2); }
  .k3{ background:var(--ok); }
  .controls{
    display:flex; gap:10px; flex-wrap:wrap;
    align-items:center; justify-content:flex-end;
    margin-top:12px;
  }
  button{
    background:transparent;
    color:var(--text);
    border:1px solid rgba(122,162,255,.6);
    padding:8px 14px;
    border-radius:12px;
    cursor:pointer;
    transition:background .2s ease, border-color .2s ease;
  }
  button:hover{ background:rgba(27,33,70,.7); border-color:var(--accent); }
  .small{ font-size:.85rem; color:var(--muted); }
  @media (max-width: 720px){
    canvas{ height: clamp(280px, 55vh, 420px); }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Transiting exoplanet</h1>
      <div class="meta">
        <span>Transit and secondary eclipse</span>
      </div>
    </header>

    <!-- Sistema estrella + planeta -->
    <section class="panel canvas-box">
      <div class="legend" aria-hidden="true">
        <span class="dot k1"></span> Planet
        <span class="dot k2"></span> Model
        <span class="dot k3"></span> Data
      </div>
      <canvas id="system" aria-label="Star and planet transit animation"></canvas>
      <div class="controls">
        <button id="toggle">Pause</button>
        <span class="small" id="info"></span>
      </div>
    </section>

    <!-- Curva de luz -->
    <section class="panel row">
      <canvas id="curve" aria-label="Transit light curve: model and data"></canvas>
    </section>

    <section class="small">
      Tap or click anywhere to pause or resume.
    </section>
  </div>

<script>
(function(){
  // ======= Parámetros físicos/sintéticos =======
  const P_seconds = 8.0;        // período del loop (s)
  const k = 0.12;               // Rp/Rs (radio relativo)
  const noise = 0.0008;         // ruido (desv. estándar) para "datos"
  const nSamples = 2000;         // puntos en una órbita para curva
  // Órbita proyectada (elipse para simular casi borde)
  const a_orbit_rel = 1.85;     // semieje mayor (en radios estelares)
  const b_orbit_rel = 0.22;     // semieje menor (proyección)
  const secondaryDepthRatio = 0.18; // qué fracción del tránsito principal se ve en el eclipse secundario

  // ======= Estado de animación =======
  let running = true;
  let t0 = performance.now();

  // ======= Canvases y contexto DPR-aware =======
  const sysCanvas = document.getElementById('system');
  const curveCanvas = document.getElementById('curve');
  const info = document.getElementById('info');
  const toggleBtn = document.getElementById('toggle');

  const styles = getComputedStyle(document.documentElement);
  const palette = {
    accent: styles.getPropertyValue('--accent').trim() || '#7aa2ff',
    accentWarm: styles.getPropertyValue('--accent2').trim() || '#f9b857',
    ok: styles.getPropertyValue('--ok').trim() || '#59f2a7',
    text: styles.getPropertyValue('--text').trim() || '#e8ecff',
    muted: styles.getPropertyValue('--muted').trim() || '#a7b1d6',
    border: styles.getPropertyValue('--border').trim() || '#1f2546',
    panel: styles.getPropertyValue('--panel').trim() || '#161a2e'
  };

  function colorWithAlpha(hex, alpha){
    const raw = hex.replace('#','').trim();
    if(!raw.length) return `rgba(255,255,255,${alpha})`;
    const expanded = raw.length === 3 ? raw.split('').map(ch => ch + ch).join('') : raw.padEnd(6,'0');
    const r = parseInt(expanded.slice(0,2),16);
    const g = parseInt(expanded.slice(2,4),16);
    const b = parseInt(expanded.slice(4,6),16);
    return `rgba(${r},${g},${b},${alpha})`;
  }

  function fitHiDPI(canvas, cssW, cssH){
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.max(2, Math.round(cssW * dpr));
    canvas.height = Math.max(2, Math.round(cssH * dpr));
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return ctx;
  }

  function sizeAll(){
    // System canvas ~60vh (limitado por CSS), medimos tamaño real CSS
    const sysRect = sysCanvas.getBoundingClientRect();
    sysCtx = fitHiDPI(sysCanvas, sysRect.width, sysRect.height);

    const curRect = curveCanvas.getBoundingClientRect();
    curveCtx = fitHiDPI(curveCanvas, curRect.width, curRect.height);

    // Repreparar elementos dependientes de tamaño
    prepSystemLayout();
    prepCurveData(); // recalcula ejes y curva (mismo período/geom)
    drawOnce();      // repinta estático inmediato
  }

  let sysCtx, curveCtx;
  window.addEventListener('resize', sizeAll, {passive:true});
  window.addEventListener('orientationchange', sizeAll, {passive:true});

  // ======= Geometría del sistema en pixeles =======
  let starR_px, planetR_px, cx, cy, ax_px, by_px, omega;
  function prepSystemLayout(){
    const w = sysCanvas.getBoundingClientRect().width;
    const h = sysCanvas.getBoundingClientRect().height;

    // Radio estelar ocupa ~min(w,h)/6 para buena visibilidad
    const base = Math.min(w, h);
    starR_px = Math.max(28, base/6);
    planetR_px = starR_px * k;

    // Centro y orbitas: margen amable
    cx = w * 0.5;
    cy = h * 0.55;

    ax_px = a_orbit_rel * starR_px;
    by_px = b_orbit_rel * starR_px;

    omega = 2*Math.PI / P_seconds;
  }

  // ======= Geometría exacta de solapamiento de círculos =======
  // Devuelve área solapada entre dos discos de radios R y r separados por d
  function circleOverlapArea(R, r, d){
    // Casos límite:
    if (d >= R + r) return 0;             // no solapan
    if (d <= Math.abs(R - r)) {           // uno dentro del otro
      const rr = Math.min(R, r);
      return Math.PI * rr * rr;
    }
    // Fórmula estándar de intersección de dos círculos
    const R2 = R*R, r2 = r*r;
    const alpha = Math.acos( (d*d + R2 - r2) / (2*d*R) ) * 2;
    const beta  = Math.acos( (d*d + r2 - R2) / (2*d*r) ) * 2;
    const area1 = 0.5 * R2 * (alpha - Math.sin(alpha));
    const area2 = 0.5 * r2 * (beta  - Math.sin(beta));
    return area1 + area2;
  }

  // ======= Modelo de flujo uniforme (sin LD) =======
  // Flux = 1 - (área solapada) / (área estrella)
  function fluxUniform(z, k){ // z = d/Rs
    const R = 1.0;
    const r = k;
    const d = z;
    const areaOverlap = circleOverlapArea(R, r, d);
    const areaStar = Math.PI * R*R;
    return 1 - areaOverlap/areaStar;
  }

  function fluxWithSecondary(theta, z){
    const baseFlux = fluxUniform(z, k);
    if(Math.sin(theta) >= 0) return baseFlux;

    const primaryDepth = Math.max(0, 1 - baseFlux);
    if(primaryDepth <= 0) return 1;

    const secondaryDepth = primaryDepth * secondaryDepthRatio;
    const flux = 1 - secondaryDepth;
    return Math.max(0, Math.min(1, flux));
  }

  // ======= Generación de curva (modelo + datos) =======
  let times = [], modelFlux = [], dataFlux = [];
  let xCurve, yCurve, plotBox, yMin=0.996, yMax=1.004;

  function prepCurveData(){
    const w = curveCanvas.getBoundingClientRect().width;
    const h = curveCanvas.getBoundingClientRect().height;

    // Margen para ejes
    const L = Math.max(40, Math.min(60, w*0.07));
    const B = Math.max(30, Math.min(42, h*0.18));
    const T = Math.max(10, Math.min(20, h*0.1));
    const Rm = Math.max(10, Math.min(20, w*0.04));

    plotBox = { x: L, y: T, w: w - L - Rm, h: h - T - B };

    times = [];
    modelFlux = [];
    dataFlux = [];

    for (let i=0; i<nSamples; i++){
      const f = i/(nSamples-1);
      const t = f * P_seconds; // 0..P
      times.push(t);

      const theta = omega * t;
      const x = ax_px * Math.cos(theta);
      const y = by_px * Math.sin(theta);
      const d_pix = Math.hypot(x, y);
      const z = d_pix / starR_px; // separación normalizada por Rs
      const F = fluxWithSecondary(theta, z);
      modelFlux.push(F);

      // datos ruidosos
      const noisy = F + randn()*noise;
      dataFlux.push(noisy);
    }

    // Escala Y automática (un poco de margen)
    const minF = Math.min(...dataFlux, ...modelFlux);
    const maxF = Math.max(...dataFlux, ...modelFlux);
    const pad = 0.0008;
    yMin = Math.max(0, minF - pad);
    yMax = Math.min(1.01, maxF + pad);

    xCurve = t => plotBox.x + (t/P_seconds) * plotBox.w;
    yCurve = F => plotBox.y + (1 - (F - yMin)/(yMax - yMin)) * plotBox.h;
  }

  function randn(){
    // Box-Muller
    const u = Math.random() || 1e-9;
    const v = Math.random() || 1e-9;
    return Math.sqrt(-2*Math.log(u)) * Math.cos(2*Math.PI*v);
  }

  // ======= Dibujo: sistema =======
  function computeState(t){
    const theta = omega * t;
    const cosTheta = Math.cos(theta);
    const sinTheta = Math.sin(theta);
    const px = cx + ax_px * cosTheta;
    const py = cy + by_px * sinTheta;
    const d_pix = Math.hypot(px - cx, py - cy);
    const z = d_pix / starR_px;
    const flux = Math.max(0, Math.min(1.05, fluxWithSecondary(theta, z)));
    return {
      t,
      theta,
      cosTheta,
      sinTheta,
      px,
      py,
      d_pix,
      z,
      flux,
      phase: t / P_seconds
    };
  }

  function drawSystem(state){
    const ctx = sysCtx;
    const w = sysCanvas.getBoundingClientRect().width;
    const h = sysCanvas.getBoundingClientRect().height;

    ctx.clearRect(0,0,w,h);

    // Fondo estrellado suave
    const g = ctx.createRadialGradient(cx, cy, starR_px*0.5, cx, cy, Math.max(w,h)*0.9);
    g.addColorStop(0, "#111936");
    g.addColorStop(1, "#050712");
    ctx.fillStyle = g;
    ctx.fillRect(0,0,w,h);

    // Órbita (elipse)
    ctx.strokeStyle = colorWithAlpha(palette.border, 0.85);
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    for(let i=0;i<=180;i++){
      const th = i/180*2*Math.PI;
      const x = cx + ax_px*Math.cos(th);
      const y = cy + by_px*Math.sin(th);
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.stroke();

    const { px, py, sinTheta } = state;

    // Dibuja estrella (brillo)
    const starGlow = ctx.createRadialGradient(cx, cy, starR_px*0.1, cx, cy, starR_px*2.2);
    starGlow.addColorStop(0, "rgba(255,240,200,0.7)");
    starGlow.addColorStop(1, "rgba(255,240,200,0.0)");
    ctx.fillStyle = starGlow;
    ctx.beginPath();
    ctx.arc(cx, cy, starR_px*2.2, 0, Math.PI*2);
    ctx.fill();

    // Disco estrella
    const starDisk = ctx.createRadialGradient(cx, cy, starR_px*0.1, cx, cy, starR_px);
    starDisk.addColorStop(0, "#ffe8b3");
    starDisk.addColorStop(1, "#f6bf6a");
    ctx.fillStyle = starDisk;
    ctx.strokeStyle = colorWithAlpha(palette.border, 0.45);
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.arc(cx, cy, starR_px, 0, Math.PI*2);
    ctx.fill();
    ctx.stroke();

    // ¿Delante o detrás? Usamos el signo de sin(theta) para z-order
    const inFront = sinTheta > 0;

    if(!inFront){
      // Planeta detrás (dibujarlo antes de la estrella para quedar oculto)
      drawPlanet(ctx, px, py, planetR_px, palette.accent);
      // Vuelve a dibujar la estrella para asegurar que queda por delante
      ctx.fillStyle = starDisk;
      ctx.beginPath(); ctx.arc(cx, cy, starR_px, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = colorWithAlpha(palette.border, 0.45);
      ctx.stroke();
    }else{
      // Planeta delante
      drawPlanet(ctx, px, py, planetR_px, palette.accent);
    }

    // Info
    const depthApprox = (k*k*1000).toFixed(2);
    const secondaryApprox = (k*k*secondaryDepthRatio*1000).toFixed(2);
  }

  function drawPlanet(ctx, x, y, r, color){
    // Halo tenue
    const halo = ctx.createRadialGradient(x, y, r*0.1, x, y, r*2.2);
    halo.addColorStop(0, colorWithAlpha(color, 0.18));
    halo.addColorStop(1, colorWithAlpha(color, 0.0));
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(x, y, r*2.2, 0, Math.PI*2);
    ctx.fill();

    // Disco
    ctx.fillStyle = color;
    ctx.strokeStyle = colorWithAlpha(palette.border, 0.7);
    ctx.lineWidth = 0.6;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI*2);
    ctx.fill();
    ctx.stroke();

    // “Brillo” sutil
    const glare = ctx.createRadialGradient(x - r*0.35, y - r*0.35, r*0.1, x, y, r*1.1);
    glare.addColorStop(0, "rgba(255,255,255,0.45)");
    glare.addColorStop(1, "rgba(255,255,255,0.0)");
    ctx.fillStyle = glare;
    ctx.beginPath();
    ctx.arc(x, y, r*1.05, 0, Math.PI*2);
    ctx.fill();
  }

  // ======= Dibujo de la curva =======
  function drawCurveAxes(){
    const ctx = curveCtx;
    const w = curveCanvas.getBoundingClientRect().width;
    const h = curveCanvas.getBoundingClientRect().height;

    // Fondo
    const g = ctx.createLinearGradient(0,0,0,h);
    g.addColorStop(0, colorWithAlpha(palette.panel, 0.92));
    g.addColorStop(1, colorWithAlpha(palette.panel, 1));
    ctx.fillStyle = g;
    ctx.fillRect(0,0,w,h);

    // Área de plotting
    ctx.fillStyle = colorWithAlpha(palette.text, 0.04);
    ctx.fillRect(plotBox.x, plotBox.y, plotBox.w, plotBox.h);

    // Ejes
    ctx.strokeStyle = colorWithAlpha(palette.border, 0.9);
    ctx.lineWidth = 1;
    ctx.strokeRect(plotBox.x, plotBox.y, plotBox.w, plotBox.h);

    // Ticks X (fase 0..1)
    ctx.fillStyle = palette.muted || "#a7b1d6";
    ctx.font = "12px system-ui,-apple-system,Segoe UI,Roboto";
    ctx.textAlign = "center"; ctx.textBaseline = "top";
    for(let i=0;i<=4;i++){
      const f = i/4;
      const xx = plotBox.x + f*plotBox.w;
      ctx.strokeStyle = colorWithAlpha(palette.border, 0.8);
      ctx.beginPath(); ctx.moveTo(xx, plotBox.y+plotBox.h); ctx.lineTo(xx, plotBox.y+plotBox.h+5); ctx.stroke();
      ctx.fillText((f).toFixed(2), xx, plotBox.y+plotBox.h+6);
    }

    // Ticks Y (flujo)
    ctx.textAlign = "right"; ctx.textBaseline = "middle";
    ctx.fillStyle = palette.muted || "#a7b1d6";
    const Nty = 4;
    for(let i=0;i<=Nty;i++){
      const frac = i/Nty;
      const F = yMin + frac*(yMax-yMin);
      const yy = yCurve(F);
      ctx.strokeStyle = colorWithAlpha(palette.border, 0.8);
      ctx.beginPath(); ctx.moveTo(plotBox.x-5, yy); ctx.lineTo(plotBox.x, yy); ctx.stroke();
      ctx.fillText(F.toFixed(4), plotBox.x - 7, yy);
    }

    // Etiquetas
    ctx.textAlign = "center"; ctx.textBaseline = "bottom";
    ctx.fillStyle = palette.text || "#e8ecff";
    ctx.fillText("Phase", plotBox.x + plotBox.w/2, plotBox.y + plotBox.h + 28);

    ctx.save();
    ctx.translate(12, plotBox.y + plotBox.h/2);
    ctx.rotate(-Math.PI/2);
    ctx.textAlign = "center"; ctx.textBaseline = "top";
    ctx.fillStyle = palette.text || "#e8ecff";
    ctx.fillText("Normalized flux", 0, 0);
    ctx.restore();
  }

  function drawCurveData(state){
    const ctx = curveCtx;

    if(times.length < 2){
      ctx.strokeStyle = palette.accentWarm;
      ctx.lineWidth = 2;
      ctx.beginPath();
      for(let i=0;i<times.length;i++){
        const xx = xCurve(times[i]);
        const yy = yCurve(modelFlux[i]);
        if(i===0) ctx.moveTo(xx,yy); else ctx.lineTo(xx,yy);
      }
      ctx.stroke();

      ctx.fillStyle = palette.ok;
      for(let i=0;i<times.length;i+=2){
        const xx = xCurve(times[i]);
        const yy = yCurve(dataFlux[i]);
        ctx.beginPath();
        ctx.arc(xx, yy, 2.0, 0, Math.PI*2);
        ctx.fill();
      }
      return;
    }

    const lastIndex = times.length - 1;
    const totalSegments = lastIndex;
    const progressFloat = (state.t / P_seconds) * totalSegments;
    const clampedFloat = Math.max(0, Math.min(progressFloat, totalSegments - 1e-6));
    const idx0 = Math.floor(clampedFloat);
    const frac = clampedFloat - idx0;
    const idx1 = Math.min(idx0 + 1, lastIndex);

    const segT0 = times[idx0];
    const segT1 = times[idx1];
    const interpTime = segT0 + (segT1 - segT0) * frac;
    const interpFluxModel = modelFlux[idx0] + (modelFlux[idx1] - modelFlux[idx0]) * frac;

    ctx.strokeStyle = palette.accentWarm;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(xCurve(times[0]), yCurve(modelFlux[0]));
    for(let i=1;i<=idx0;i++){
      const xx = xCurve(times[i]);
      const yy = yCurve(modelFlux[i]);
      ctx.lineTo(xx,yy);
    }
    ctx.lineTo(xCurve(interpTime), yCurve(interpFluxModel));
    ctx.stroke();

    ctx.fillStyle = palette.ok;
    for(let i=0;i<=idx0;i+=2){
      const xx = xCurve(times[i]);
      const yy = yCurve(dataFlux[i]);
      ctx.beginPath();
      ctx.arc(xx, yy, 2.0, 0, Math.PI*2);
      ctx.fill();
    }
    if(idx0 % 2 === 1){
      const xx = xCurve(times[idx0]);
      const yy = yCurve(dataFlux[idx0]);
      ctx.beginPath();
      ctx.arc(xx, yy, 2.0, 0, Math.PI*2);
      ctx.fill();
    }

    const interpFluxData = dataFlux[idx0] + (dataFlux[idx1] - dataFlux[idx0]) * frac;
    const interpX = xCurve(interpTime);
    const interpYData = yCurve(interpFluxData);
    ctx.beginPath();
    ctx.arc(interpX, interpYData, 2.0, 0, Math.PI*2);
    ctx.fill();
  }

  // Marcador de tiempo vivo sobre la curva
  function drawLiveMarker(F, t){
    const ctx = curveCtx;
    const xx = xCurve(t);
    const yy = yCurve(F);

    // Línea vertical
    ctx.save();
    ctx.strokeStyle = colorWithAlpha(palette.accent, 0.35);
    ctx.lineWidth = 1;
    ctx.setLineDash([4,4]);
    ctx.beginPath();
    ctx.moveTo(xx, plotBox.y);
    ctx.lineTo(xx, plotBox.y + plotBox.h);
    ctx.stroke();
    ctx.restore();

    // Punto
    ctx.fillStyle = palette.accent;
    ctx.beginPath(); ctx.arc(xx, yy, 3.2, 0, Math.PI*2); ctx.fill();
  }

  function drawCurve(state){
    drawCurveAxes();
    drawCurveData(state);
    drawLiveMarker(state.flux, state.t);
  }

  // ======= Bucle de animación =======
  function frame(now){
    if(!running){ drawOnce(); return; }
    const elapsed = (now - t0)/1000;
    const t = ((elapsed % P_seconds) + P_seconds) % P_seconds;
    const state = computeState(t);
    drawSystem(state);
    drawCurve(state);
    requestAnimationFrame(frame);
  }

  function drawOnce(){
    const now = performance.now();
    const elapsed = (now - t0)/1000;
    const t = ((elapsed % P_seconds) + P_seconds) % P_seconds;
    const state = computeState(t);
    drawSystem(state);
    drawCurve(state);
  }

  // ======= Interacción =======
  toggleBtn.addEventListener('click', () => {
    running = !running;
    toggleBtn.textContent = running ? "Pause" : "Resume";
    if(running){ t0 = performance.now() - ((performance.now()-t0)% (P_seconds*1000)); requestAnimationFrame(frame); }
  });

  // Tap/click on any canvas toggles play/pause
  [sysCanvas, curveCanvas].forEach(c => {
    c.addEventListener('click', () => toggleBtn.click());
    c.addEventListener('touchstart', (e) => { e.preventDefault(); toggleBtn.click(); }, {passive:false});
  });

  // ======= Arranque =======
  let sysReady = false, curveReady = false;
  // Creamos ctx una vez
  sysCtx = sysCanvas.getContext('2d');
  curveCtx = curveCanvas.getContext('2d');
  // Ajuste inicial tras layout
  window.requestAnimationFrame(() => { sizeAll(); requestAnimationFrame(frame); });

})();
</script>
</body>
</html>

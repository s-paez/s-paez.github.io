imports:
  - path: github.com/HugoBlox/hugo-blox-builder/modules/blox-tailwind

mounts:
  - source: layouts
    target: layouts
  - source: assets
    target: assets
  - source: content/en
    target: content
    lang: en
  - source: content/es
    target: content
    lang: es
  # Share one portrait while retaining the theme's author-resource API.
  - source: assets/media/avatar.jpg
    target: content/authors/admin/avatar.jpg
    lang: en
  - source: assets/media/avatar.jpg
    target: content/authors/admin/avatar.jpg
    lang: es
  - source: assets/media/avatar.jpg
    target: content/authors/spaez/avatar.jpg
    lang: en
  - source: assets/media/avatar.jpg
    target: content/authors/spaez/avatar.jpg
    lang: es
